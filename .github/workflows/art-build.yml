name: Unified ART build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unified-art-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  host-checks:
    runs-on: [self-hosted, linux, x64, art-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.ART_CI_CHECKOUT_TOKEN || github.token }}
      - name: Run host contracts
        shell: python {0}
        run: |
          import subprocess
          import sys
          raise SystemExit(subprocess.call(
              [sys.executable, "tools/ci_art.py", "--cell", "host-checks"]
          ))

  linux-hosted-products:
    runs-on: [self-hosted, linux, x64, art-build]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cell:
          - linux-product
          - windows-cross
    env:
      ART_BUILD_CI_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.ART_CI_CHECKOUT_TOKEN || github.token }}
      - name: Run ${{ matrix.cell }}
        shell: python {0}
        run: |
          import subprocess
          import sys
          raise SystemExit(subprocess.call([
              sys.executable,
              "tools/ci_art.py",
              "--cell",
              "${{ matrix.cell }}",
          ]))

  windows-native-product:
    runs-on: [self-hosted, windows, x64, art-build]
    timeout-minutes: 240
    env:
      ART_BUILD_CI_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.ART_CI_CHECKOUT_TOKEN || github.token }}
      - name: Run native Windows product and catalog
        shell: python {0}
        run: |
          import subprocess
          import sys
          raise SystemExit(subprocess.call([
              sys.executable,
              "tools/ci_art.py",
              "--cell",
              "windows-native",
          ]))
